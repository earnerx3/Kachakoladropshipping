<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Services</title>
    
    <!-- Telegram & Firebase SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #05090e;
            --bg-card: #11161d;
            --primary: #FFD700;
            --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FDB931 100%);
            --text-main: #ffffff;
            --text-muted: #8B949E;
            --border: rgba(255, 255, 255, 0.08);
            --glass: blur(12px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
        }

        /* --- HEADER --- */
        .header {
            padding: 15px 20px;
            background: rgba(5, 9, 14, 0.9);
            backdrop-filter: var(--glass);
            position: sticky; top: 0; z-index: 50;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 15px;
        }
        .back-btn { 
            font-size: 20px; color: var(--text-main); cursor: pointer; padding: 5px; 
            transition: 0.3s;
        }
        .back-btn:active { color: var(--primary); transform: scale(0.9); }
        
        .page-title { 
            font-size: 18px; font-weight: 700; 
            background: var(--primary-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            display: flex; align-items: center; gap: 8px; 
        }

        /* --- CONTAINER & CARDS --- */
        .container { padding: 20px; padding-bottom: 40px; }

        .service-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            position: relative;
        }
        .service-card:active { transform: scale(0.98); }

        .svc-img-box {
            width: 100%; height: 160px; position: relative;
        }
        .svc-img { width: 100%; height: 100%; object-fit: cover; }
        .svc-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: var(--primary);
            backdrop-filter: blur(5px); border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 10px; font-weight: 700;
            padding: 4px 10px; border-radius: 20px; text-transform: uppercase;
        }

        .svc-content { padding: 15px; }
        .svc-title { font-size: 16px; font-weight: 600; margin-bottom: 5px; color: #fff; }
        .svc-price { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        
        .btn-details {
            width: 100%; padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px; color: #ccc;
            font-size: 13px; font-weight: 500;
            display: flex; justify-content: center; align-items: center; gap: 5px;
        }

        /* --- MODAL (POPUP) --- */
        .detail-modal {
            position: fixed; inset: 0;
            background: #000; z-index: 1000;
            display: none; flex-direction: column;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-controls {
            position: absolute; top: 15px; right: 15px; z-index: 1002;
        }
        .close-btn {
            width: 35px; height: 35px; background: rgba(0,0,0,0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; cursor: pointer; backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .modal-hero { width: 100%; height: 300px; flex-shrink: 0; position: relative; }
        .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, #000); }

        .modal-body { 
            padding: 20px; flex: 1; overflow-y: auto; 
            margin-top: -50px; position: relative; z-index: 1001; 
            padding-bottom: 100px;
        }
        
        .m-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 5px; line-height: 1.2; }
        .m-desc-box {
            background: rgba(255,255,255,0.05); 
            padding: 15px; border-radius: 12px; margin-top: 20px;
            border: 1px solid var(--border);
        }
        .m-desc-text { font-size: 13px; color: #b0b0b0; line-height: 1.6; white-space: pre-line; }

        /* --- BOTTOM ACTION BAR --- */
        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 15px 20px;
            background: rgba(17, 22, 29, 0.95); 
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1005;
        }
        .final-price { font-size: 24px; font-weight: 700; color: var(--primary); }
        
        .btn-pay {
            background: var(--primary-gradient); color: #000;
            border: none; padding: 12px 30px;
            border-radius: 10px; font-weight: 700; font-size: 15px;
            box-shadow: 0 5px 15px rgba(253, 216, 53, 0.3);
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .btn-pay:active { transform: scale(0.95); }

        /* Loader */
        .skeleton { background: #1a2029; height: 200px; border-radius: 16px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <!-- Back button: Directly goes to Dropshping.html -->
        <i class="fas fa-arrow-left back-btn" onclick="window.location.href='index.html'"></i>
        <div class="page-title">
            <i class="fas fa-crown" style="color:var(--primary)"></i> Premium Store
        </div>
    </div>

    <!-- Services List -->
    <div class="container" id="services-container">
        <!-- Loading Skeletons -->
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="detail-modal">
        <div class="modal-controls">
            <div class="close-btn" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </div>
        </div>

        <div class="modal-hero">
            <img id="m-image" src="" alt="Service Banner">
            <div class="hero-overlay"></div>
        </div>

        <div class="modal-body">
            <h2 id="m-title" class="m-title">...</h2>
            
            <div class="m-desc-box">
                <div style="font-size:12px; color:var(--primary); margin-bottom:5px; text-transform:uppercase;">Description</div>
                <div id="m-description" class="m-desc-text">...</div>
            </div>
        </div>

        <div class="bottom-action-bar">
            <div>
                <div style="font-size:10px; color:#888;">TOTAL PRICE</div>
                <div id="m-footer-price" class="final-price">৳ 0</div>
            </div>
            <button class="btn-pay" id="payBtn" onclick="processPayment()">
                Buy Now <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        // আপনার দেওয়া কনফিগারেশন ব্যবহার করা হয়েছে
        const firebaseConfig = {
            apiKey: "AIzaSyC2yM6GXC2kZMEEMYjdsveDpDHfKzriq0I",
            authDomain: "nahid-fa459.firebaseapp.com",
            projectId: "nahid-fa459",
            storageBucket: "nahid-fa459.firebasestorage.app",
            messagingSenderId: "970994023392",
            appId: "1:970994023392:web:571332949894edcf4d0985"
        };
        
        // ফায়ারবেস লোড হয়েছে কিনা চেক করা
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentServiceData = null; 

        // --- 1. SERVICE LIST LOAD ---
        db.collection('services').onSnapshot(snap => {
            const container = document.getElementById('services-container');
            container.innerHTML = '';
            
            if(snap.empty) {
                container.innerHTML = '<div style="text-align:center; color:#777; margin-top:50px;">No Services Available</div>';
                return;
            }

            snap.forEach(doc => {
                const d = doc.data();
                const serviceId = doc.id;
                // ডাটা অবজেক্ট তৈরি করে স্ট্রিং এ কনভার্ট করা হচ্ছে যাতে ক্লিকের সময় পাস করা যায়
                const dataString = JSON.stringify({id: serviceId, ...d}).replace(/"/g, '&quot;');

                const html = `
                    <div class="service-card" onclick="openModal(${dataString})">
                        <div class="svc-img-box">
                            <img src="${d.image || 'https://placehold.co/600x400/111/333'}" class="svc-img">
                            <div class="svc-badge">PREMIUM</div>
                        </div>
                        <div class="svc-content">
                            <div class="svc-title">${d.title || 'Service Name'}</div>
                            <div class="svc-price">৳ ${d.price || '0'}</div>
                            <div class="btn-details">View Details <i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        });

        // --- 2. MODAL FUNCTIONS ---
        function openModal(data) {
            currentServiceData = data;
            
            // মোডালে ডাটা সেট করা
            document.getElementById('m-image').src = data.image || 'https://placehold.co/600x400/111/333';
            document.getElementById('m-title').innerText = data.title;
            document.getElementById('m-footer-price').innerText = `৳ ${data.price}`;
            document.getElementById('m-description').innerText = data.description || "No description available.";

            // মোডাল দেখানো
            const modal = document.getElementById('detailModal');
            modal.style.display = 'flex';
            
            // টেলিগ্রাম মেইন বাটন হাইড করা (কনফ্লিক্ট এড়াতে)
            if(tg.MainButton.isVisible) tg.MainButton.hide();
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            currentServiceData = null;
        }

        // --- 3. PAYMENT REDIRECT ---
        function processPayment() {
            if(!currentServiceData) return;

            const btn = document.getElementById('payBtn');
            const originalHTML = btn.innerHTML;

            // বাটনে লোডিং ইফেক্ট
            btn.innerHTML = 'Wait...';
            btn.disabled = true;

            // ডাটা ইউআরএল প্যারামিটার হিসেবে সাজানো
            const params = new URLSearchParams({
                serviceId: currentServiceData.id,
                title: currentServiceData.title,
                price: currentServiceData.price,
                img: currentServiceData.image || ''
            });

            // payment.html পেজে পাঠানো
            setTimeout(() => {
                window.location.href = `payment.html?${params.toString()}`;
                
                // বাটন রিসেট (যদি ইউজার আবার ফিরে আসে)
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }, 2000);
            }, 500);
        }

    </script>
</body>
</html>
