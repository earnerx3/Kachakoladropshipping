<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Payment</title>
    
    <!-- Telegram & Firebase SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --bg: #05090e; 
            --card-bg: #11161d;
            --primary: #FDD835; 
            --primary-gradient: linear-gradient(135deg, #FFD700 0%, #FDB931 100%);
            --text-main: #fff; 
            --text-muted: #8B949E;
            --border: rgba(255,255,255,0.08);
            --success: #00C853;
            --error: #FF3D00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 80px; }

        /* HEADER */
        .header {
            padding: 10px 15px;
            background: rgba(5, 9, 14, 0.95);
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 50;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .header h2 { font-size: 16px; font-weight: 600; color: #fff; }
        .back-icon { font-size: 20px; cursor: pointer; padding: 5px; color: #fff; }

        /* PRODUCT SUMMARY */
        .summary-card {
            margin: 15px;
            background: var(--card-bg);
            border-radius: 10px; padding: 10px;
            display: flex; align-items: center; gap: 12px;
            border: 1px solid var(--border);
        }
        .s-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #222; }
        .s-info h3 { font-size: 14px; margin-bottom: 2px; color: #fff; line-height: 1.2; }
        .s-price { color: var(--primary); font-weight: 700; font-size: 15px; }

        /* METHOD SELECTOR */
        .section-title { margin: 0 15px 5px; font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; }
        
        .methods-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 10px; margin: 0 15px 15px;
        }
        
        .method-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 10px 5px;
            text-align: center; cursor: pointer;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .method-card img { height: 25px; width: auto; object-fit: contain; margin-bottom: 4px; }
        .method-name { font-size: 11px; font-weight: 600; color: #ccc; }
        
        .method-card.selected {
            border-color: var(--primary);
            background: rgba(253, 216, 53, 0.05);
        }
        .method-card.selected .method-name { color: var(--primary); }
        .method-card.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(100%); }
        .badge-off { position: absolute; top: 0; right: 0; background: #FF3D00; color: #fff; font-size: 8px; padding: 2px 5px; border-bottom-left-radius: 6px; }

        /* PAYMENT NUMBER BOX */
        .pay-box {
            background: #0f131a; margin: 0 15px 15px;
            border-radius: 10px; border: 1px dashed #444;
            padding: 12px; text-align: center;
        }
        .pay-label { font-size: 12px; color: #aaa; margin-bottom: 8px; line-height: 1.4; }
        .number-display {
            background: #1a2029; padding: 8px 12px;
            border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border: 1px solid var(--border); width: 100%; cursor: pointer;
        }
        .the-number { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
        .copy-btn { color: #fff; font-size: 14px; }

        /* FORM INPUTS */
        .form-container { margin: 0 15px; }
        .input-group { position: relative; margin-bottom: 10px; }
        
        .input-icon { 
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%); 
            color: #666; font-size: 14px; 
        }
        
        .inp-field {
            width: 100%; background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 12px 10px 40px;
            border-radius: 8px; color: #fff;
            font-size: 13px; outline: none; transition: 0.3s;
        }
        .inp-field:focus { border-color: var(--primary); }
        .inp-field::placeholder { color: #555; font-size: 12px; }

        /* BOTTOM BAR */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg); padding: 12px 15px;
            border-top: 1px solid var(--border); z-index: 100;
        }
        .btn-submit {
            width: 100%; background: var(--primary-gradient); color: #000;
            border: none; padding: 12px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 216, 53, 0.25);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            transition: 0.3s;
        }
        .btn-submit:disabled { opacity: 0.8; cursor: not-allowed; }
        /* Success State for Button */
        .btn-success-state {
            background: #00C853 !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(0, 200, 83, 0.4) !important;
        }

        /* Loader */
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left back-icon" onclick="window.location.href='premium_services.html'"></i>
        <h2>পেমেন্ট সম্পন্ন করুন</h2>
    </div>

    <!-- Product Summary -->
    <div class="summary-card">
        <img id="p-img" src="" class="s-img">
        <div class="s-info">
            <h3 id="p-title">Loading...</h3>
            <div id="p-price" class="s-price">...</div>
        </div>
    </div>

    <!-- Payment Methods -->
    <div class="section-title">১. মেথড সিলেক্ট করুন</div>
    <div id="method-container" class="methods-grid">
        <div class="method-card" id="btn-bkash" onclick="selectMethod('bkash')">
            <img src="https://freelogopng.com/images/all_img/1656234745bkash-app-logo-png.png">
            <div class="method-name">bKash</div>
            <div class="badge-off" id="badge-bkash" style="display:none;">OFF</div>
        </div>
        <div class="method-card" id="btn-nagad" onclick="selectMethod('nagad')">
            <img src="https://freelogopng.com/images/all_img/1679248787Nagad-Logo.png">
            <div class="method-name">Nagad</div>
            <div class="badge-off" id="badge-nagad" style="display:none;">OFF</div>
        </div>
    </div>

    <!-- Number Display -->
    <div class="pay-box">
        <div class="pay-label">
            নিচের <span id="m-name" style="color:var(--primary); font-weight:bold;">...</span> নাম্বারে 
            <span style="color:#fff; font-weight:600;">Send Money</span> করুন
        </div>
        <div class="number-display" onclick="copyToClipboard()">
            <span id="target-number" class="the-number">Loading...</span>
            <div class="copy-btn"><i class="far fa-copy"></i></div>
        </div>
    </div>

    <!-- Input Forms -->
    <div class="section-title">২. আপনার তথ্য এবং পেমেন্ট প্রুফ</div>
    <div class="form-container">
        <div class="input-group">
            <i class="fab fa-whatsapp input-icon"></i>
            <input type="text" id="contactInfo" class="inp-field" placeholder="WhatsApp Number / Telegram ID">
        </div>
        <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="userEmail" class="inp-field" placeholder="Email Address (ডেলিভারির জন্য)">
        </div>
        <div style="margin-top: 15px;"></div>
        <div class="input-group">
            <i class="fas fa-mobile-alt input-icon"></i>
            <input type="number" id="senderPhone" class="inp-field" placeholder="যে নাম্বার থেকে টাকা পাঠিয়েছেন">
        </div>
        <div class="input-group">
            <i class="fas fa-receipt input-icon"></i>
            <input type="text" id="trxId" class="inp-field" placeholder="Transaction ID (TrxID)" style="text-transform:uppercase;">
        </div>
    </div>

    <!-- Submit Button -->
    <div class="bottom-bar">
        <button id="submitBtn" class="btn-submit" onclick="submitOrder()">
            <span id="btnText">Confirm Order</span>
            <div class="spinner"></div>
        </button>
    </div>

    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyC2yM6GXC2kZMEEMYjdsveDpDHfKzriq0I",
            authDomain: "nahid-fa459.firebaseapp.com",
            projectId: "nahid-fa459",
            storageBucket: "nahid-fa459.firebasestorage.app",
            messagingSenderId: "970994023392",
            appId: "1:970994023392:web:571332949894edcf4d0985"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. URL Params
        const params = new URLSearchParams(window.location.search);
        const serviceData = {
            id: params.get('serviceId'),
            title: params.get('title'),
            price: params.get('price'),
            img: params.get('img')
        };

        // 2. Render Data
        document.getElementById('p-title').innerText = serviceData.title || 'Unknown Service';
        document.getElementById('p-price').innerText = `৳ ${serviceData.price || 0}`;
        if(serviceData.img) document.getElementById('p-img').src = serviceData.img;

        let appSettings = {};
        let currentMethod = null;

        // --- 3. Load Settings ---
        function loadSettings() {
            db.collection('settings').doc('config').onSnapshot(doc => {
                if (doc.exists) {
                    appSettings = doc.data();
                    
                    updateMethodUI('bkash', appSettings.isBkashActive);
                    updateMethodUI('nagad', appSettings.isNagadActive);
                    
                    if(appSettings.isBkashActive) selectMethod('bkash');
                    else if(appSettings.isNagadActive) selectMethod('nagad');
                    else {
                        document.getElementById('target-number').innerText = "Closed";
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('submitBtn').style.background = "#333";
                        document.getElementById('btnText').innerText = "Payments Closed";
                    }
                }
            });
        }

        function updateMethodUI(method, isActive) {
            const el = document.getElementById(`btn-${method}`);
            const badge = document.getElementById(`badge-${method}`);
            if(!isActive) {
                el.classList.add('disabled');
                badge.style.display = 'block';
            } else {
                el.classList.remove('disabled');
                badge.style.display = 'none';
            }
        }

        function selectMethod(method) {
            let isActive = false;
            let number = "";

            if(method === 'bkash') {
                isActive = appSettings.isBkashActive;
                number = appSettings.bkash;
            } else if(method === 'nagad') {
                isActive = appSettings.isNagadActive;
                number = appSettings.nagad;
            }

            if(!isActive) return;
            currentMethod = method;
            document.querySelectorAll('.method-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(`btn-${method}`).classList.add('selected');
            document.getElementById('m-name').innerText = method.charAt(0).toUpperCase() + method.slice(1);
            document.getElementById('target-number').innerText = number || "Not Set";
        }

        function copyToClipboard() {
            const num = document.getElementById('target-number').innerText;
            if(num.length < 5 || num === "Closed") return;
            navigator.clipboard.writeText(num).then(() => {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                const btn = document.querySelector('.copy-btn');
                btn.innerHTML = '<i class="fas fa-check" style="color:#00C853"></i>';
                setTimeout(() => btn.innerHTML = '<i class="far fa-copy"></i>', 2000);
            });
        }

        // --- 6. Submit Order (FIXED LOGIC) ---
        function submitOrder() {
            const contactInfo = document.getElementById('contactInfo').value;
            const userEmail = document.getElementById('userEmail').value;
            const senderPhone = document.getElementById('senderPhone').value;
            const trxId = document.getElementById('trxId').value;

            if(!currentMethod) { tg.showAlert("Please select a payment method."); return; }
            if(!contactInfo || !senderPhone || !trxId || !userEmail) {
                tg.showAlert("অনুগ্রহ করে সব তথ্য সঠিক ভাবে পূরণ করুন।");
                return;
            }

            const btn = document.getElementById('submitBtn');
            const spinner = document.querySelector('.spinner');
            const btnText = document.getElementById('btnText');

            // 1. Loading UI
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.style.display = 'none';

            // 2. Data Object
            const orderData = {
                serviceId: serviceData.id,
                serviceTitle: serviceData.title,
                amount: serviceData.price,
                method: currentMethod,
                adminNumber: document.getElementById('target-number').innerText,
                
                userContact: contactInfo,
                userEmail: userEmail,
                senderNumber: senderPhone,
                trxId: trxId.toUpperCase(),
                
                userId: tg.initDataUnsafe?.user?.id || 'guest',
                userName: tg.initDataUnsafe?.user?.username || 'guest',
                fullName: tg.initDataUnsafe?.user?.first_name || '',
                
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            // 3. Save to DB and Force UI Update
            db.collection('orders').add(orderData)
            .then(() => {
                // ডাটা সেভ হওয়ার সাথে সাথে বাটন আপডেট করা
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                btnText.innerText = 'Order Successful! ✅';
                btn.classList.add('btn-success-state');
                
                // হ্যাপটিক ফিডব্যাক (যদি থাকে)
                try { if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch(e){}

                // রিডাইরেক্ট ফাংশন
                const goHome = () => { window.location.href = 'index.html'; };

                // ২ সেকেন্ড পর অটো রিডাইরেক্ট (Safety Net)
                setTimeout(goHome, 2000);

                // পপ-আপ দেখানোর চেষ্টা (যদি কাজ করে ভালো, না করলে অটো রিডাইরেক্ট তো আছেই)
                try {
                    if(tg && tg.showPopup) {
                        tg.showPopup({
                            title: 'Order Placed! ✅',
                            message: 'আপনার অর্ডার সফল হয়েছে। ২ সেকেন্ডের মধ্যে আপনাকে হোম পেজে নিয়ে যাওয়া হবে।',
                            buttons: [{type: 'ok', text: 'OK'}]
                        }, function() {
                            goHome(); // ইউজার ওকে চাপলে সাথে সাথে যাবে
                        });
                    }
                } catch(e) {
                    console.log("Popup failed, waiting for auto-redirect");
                }
            })
            .catch(err => {
                console.error(err);
                // Error হলে বাটন রিসেট
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                btnText.innerText = 'Confirm Order';
                btn.classList.remove('btn-success-state');
                tg.showAlert("Error: " + err.message);
            });
        }

        loadSettings();

    </script>
</body>
</html>
